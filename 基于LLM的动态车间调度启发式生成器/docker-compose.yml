services:
  db:
    image: mysql:8.0
    container_name: intellisched-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: intellisched_root
      MYSQL_DATABASE: intellisched
    ports:
      # Expose MySQL on host (optional; remove if not needed)
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      # Initialization script to create database, etc.
      - ./Backend/scripts/init_mysql.sql:/docker-entrypoint-initdb.d/init_mysql.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-pintellisched_root"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Backend/Dockerfile
    container_name: intellisched-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Connection settings for MySQL service inside Docker
      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: intellisched_root
      DB_NAME: intellisched
      # Allowed frontend origins (browser URLs)
      FRONTEND_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8000:8000"
    # For local debugging you can mount source code:
    # volumes:
    #   - ./Backend:/app/Backend

  frontend:
    build:
      context: .
      dockerfile: Frontend/Dockerfile
    container_name: intellisched-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # Browser calls backend on host machine
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    # For local debugging you can mount source code:
    # volumes:
    #   - ./Frontend:/app

volumes:
  db_data:

